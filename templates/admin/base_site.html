
{% extends "admin/base.html" %}
{% load static %}

{% block title %}Car Parts System Administration{% endblock %}

{% block extrastyle %}
{{ block.super }}
<style>
    :root {
        --admin-bg: #080f25;
        --admin-sidebar: #0b1630;
        --admin-panel: #10264b;
        --admin-panel-light: #142f59;
        --admin-blue: #1677ff;
        --admin-cyan: #00c8ff;
        --admin-text: #f1f5ff;
        --admin-muted: #9aacCB;
        --admin-border: rgba(148, 181, 231, 0.2);
    }

    body,
    #container {
        background: var(--admin-bg);
        color: var(--admin-text);
    }

    #header {
        background: var(--admin-sidebar);
        color: var(--admin-text);
        border-bottom: 1px solid var(--admin-border);
        padding: 14px 24px;
    }

    #branding h1,
    #branding h1 a:link,
    #branding h1 a:visited {
        color: var(--admin-text);
        font-weight: 700;
    }

    #user-tools {
        color: var(--admin-muted);
    }

    #user-tools a,
    a:link,
    a:visited {
        color: var(--admin-cyan);
    }

    a:hover {
        color: #ffffff;
    }

    #content {
        color: var(--admin-text);
    }

    #content h1,
    #content h2,
    #content h3 {
        color: var(--admin-text);
    }

    .module,
    .inline-group,
    .dashboard .module {
        background: var(--admin-panel);
        border: 1px solid var(--admin-border);
        border-radius: 10px;
        overflow: hidden;
    }

    .module caption,
    .module h2,
    .inline-group h2 {
        background: var(--admin-panel-light);
        color: var(--admin-text);
    }

    .module table {
        background: var(--admin-panel);
    }

    #changelist,
    #changelist-filter,
    .filtered #changelist-filter {
        background: var(--admin-panel);
        border-color: var(--admin-border);
    }

    #changelist-filter h2 {
        background: var(--admin-panel-light);
        color: var(--admin-text);
    }

    #changelist-filter li.selected a {
        color: var(--admin-cyan);
    }

    #changelist-search input,
    input[type="text"],
    input[type="password"],
    input[type="email"],
    input[type="number"],
    input[type="url"],
    input[type="date"],
    input[type="datetime-local"],
    textarea,
    select,
    .vTextField,
    .vLargeTextField {
        background: #091832;
        color: var(--admin-text);
        border: 1px solid #35527b;
        border-radius: 6px;
        padding: 7px 9px;
    }

    input:focus,
    textarea:focus,
    select:focus {
        outline: 2px solid var(--admin-blue);
        outline-offset: 1px;
    }

    .form-row {
        border-bottom-color: var(--admin-border);
    }

    .help,
    p.help,
    .help-tooltip {
        color: var(--admin-muted);
    }

    label {
        color: var(--admin-text);
    }

    .selector-chosen h2 {
        background: var(--admin-panel-light);
    }

    .selector-available,
    .selector-chosen {
        background: var(--admin-panel);
        border-color: var(--admin-border);
    }

    .selector-available select,
    .selector-chosen select {
        background: #091832;
        color: var(--admin-text);
    }

    .button,
    input[type="submit"],
    input[type="button"],
    .submit-row input,
    a.button,
    button {
        background: var(--admin-blue);
        color: #ffffff;
        border: 1px solid transparent;
        border-radius: 6px;
        padding: 8px 13px;
        font-weight: 600;
    }

    .button:hover,
    input[type="submit"]:hover,
    input[type="button"]:hover,
    .submit-row input:hover,
    a.button:hover,
    button:hover {
        background: #075bd0;
        color: #ffffff;
    }

    .object-tools a {
        background: var(--admin-blue);
        border-radius: 6px;
    }

    .object-tools a:hover {
        background: #075bd0;
    }

    .submit-row {
        background: var(--admin-panel);
        border: 1px solid var(--admin-border);
        border-radius: 8px;
    }

    table thead th {
        background: var(--admin-panel-light);
        color: var(--admin-text);
    }

    table tbody tr {
        background: var(--admin-panel);
    }

    table tbody tr:nth-child(even) {
        background: #0d2040;
    }

    td,
    th {
        border-bottom-color: var(--admin-border);
    }

    tr:hover td {
        background-color: rgba(22, 119, 255, 0.08);
    }

    .paginator {
        color: var(--admin-muted);
    }

    .messagelist li {
        border-radius: 7px;
        margin-bottom: 8px;
    }

    .messagelist li.success {
        background: #103c37;
        color: #8ff0cd;
    }

    .messagelist li.warning {
        background: #45351b;
        color: #ffd28a;
    }

    .messagelist li.error {
        background: #461f2a;
        color: #ffaaaa;
    }

    .errornote,
    ul.errorlist {
        color: #ffaaaa;
    }

    #footer {
        color: var(--admin-muted);
    }

    @media (max-width: 767px) {
        #header {
            padding: 12px 14px;
        }

        #content {
            padding: 15px;
        }

        .module,
        .inline-group {
            max-width: 100%;
        }

        #changelist-filter {
            width: auto;
        }
    }

    @media print {
        body,
        #container,
        #content {
            background: #ffffff !important;
            color: #000000 !important;
        }

        #header,
        .module,
        .inline-group,
        .submit-row {
            background: #ffffff !important;
            color: #000000 !important;
            box-shadow: none !important;
        }

        #content h1,
        #content h2,
        #content h3,
        td,
        th,
        label {
            color: #000000 !important;
        }
    }
</style>
{% endblock %}


{% block branding %}
<div id="site-name" style="display: flex; align-items: center; gap: 22px; flex-wrap: wrap;">
    <a href="{% url 'admin:index' %}">Car Parts System</a>
    <a href="/"style="display: inline-block; background: #1677ff; color: #ffffff; padding: 7px 13px; border-radius: 6px; font-size: 13px; font-weight: 600; text-decoration: none;">
        ← Main Dashboard
    </a>
</div>
{% endblock %}
